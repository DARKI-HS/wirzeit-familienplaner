name: WirZeit auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Web-App erstellen
        env:
          NEXT_PUBLIC_BASE_PATH: /wirzeit-familienplaner
        run: npm run build:pages

      - name: GitHub Pages einrichten
        uses: actions/configure-pages@v5

      - name: Web-App hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Web-App veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
